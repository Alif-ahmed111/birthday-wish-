<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Interactive Birthday Wish</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Playfair Display', serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Mobile Container (Strict 9:16 Aspect Ratio) */
    .mobile-frame {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 430px;
      max-height: 932px;
      aspect-ratio: 9 / 16;
      background-color: #fdf2f4;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(0,0,0,0.6);
    }

    /* ================= STAGE 1: BOW & HEART ================= */
    #stage-1 {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fdf2f4;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    .top-text {
      position: absolute;
      top: 8%;
      font-style: italic;
      color: #7d6268;
      font-size: 1.15rem;
      letter-spacing: 0.5px;
    }

    .target-heart-wrapper {
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .target-heart-glow {
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 51, 102, 0.4) 0%, rgba(255, 242, 244, 0) 70%);
      border-radius: 50%;
      animation: pulseGlow 2s infinite ease-in-out;
    }

    .target-heart {
      font-size: 130px;
      color: #ff2a5f;
      position: relative;
      z-index: 2;
      animation: heartPulse 2s infinite ease-in-out;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes heartPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .bow-container {
      position: absolute;
      bottom: 20%;
      left: 14%;
      width: 70px;
      height: 110px;
      cursor: pointer;
      touch-action: none;
      transform: rotate(-55deg);
      transform-origin: center center;
    }

    .bow-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .instruction {
      position: absolute;
      bottom: 7%;
      color: #a3898f;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .flying-arrow {
      position: absolute;
      width: 55px;
      height: 3px;
      background: #3e2723;
      display: none;
      z-index: 20;
      pointer-events: none;
      transform-origin: 0% 50%;
    }

    .flying-arrow::after {
      content: '';
      position: absolute;
      right: -8px;
      top: -4px;
      border-left: 10px solid #e63946;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
    }

    .particle {
      position: absolute;
      pointer-events: none;
      font-size: 16px;
      color: #ff2a5f;
      z-index: 25;
    }

    /* ================= STAGE 2: RED CARD WISH ================= */
    #stage-2 {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #c9184a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
      z-index: 30;
      color: #ffffff;
      text-align: center;
      padding: 0 20px;
      overflow: hidden;
    }

    #stage-2.active {
      opacity: 1;
      pointer-events: auto;
    }

    .wish-subtext {
      font-style: italic;
      font-size: 1.15rem;
      color: #ffccd5;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.6s ease 0.2s;
      position: relative;
      z-index: 5;
    }

    .wish-title {
      font-size: 3.5rem;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: 0.5px;
      opacity: 0;
      transform: translateY(15px);
      transition: all 0.6s ease 0.4s;
      position: relative;
      z-index: 5;
    }

    .wish-footer {
      margin-top: 24px;
      font-style: italic;
      font-size: 1rem;
      color: #ffccd5;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.6s ease 0.6s;
      position: relative;
      z-index: 5;
    }

    #stage-2.active .wish-subtext,
    #stage-2.active .wish-title,
    #stage-2.active .wish-footer {
      opacity: 1;
      transform: translateY(0);
    }

    /* ================= STAGE 3: REALISTIC CAKE & BALLOONS ================= */
    #stage-3 {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease;
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10% 0 5% 0;
      overflow: hidden;
    }

    #stage-3.active {
      opacity: 1;
      pointer-events: auto;
    }

    .tree-text-container {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 0 20px;
    }

    .tree-sub1 {
      font-style: italic;
      color: #3b2327;
      font-size: 0.95rem;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(255,255,255,0.8);
    }

    .tree-title {
      font-size: 3.2rem;
      font-family: 'Great Vibes', cursive;
      color: #5c0a21;
      margin: 2px 0;
      line-height: 1.1;
      text-shadow: 0 1px 4px rgba(255,255,255,0.8);
    }

    .tree-sub2 {
      font-style: italic;
      color: #3b2327;
      font-size: 19px;
      font-weight: 600;
      text-shadow: 0 1px 4px rgba(255,255,255,0.8);
    }

    /* Continuous Floating Love Balloons */
    .balloon-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      bottom: -60px;
      font-size: 2rem;
      color: #ff2a5f;
      opacity: 0.85;
      animation: floatUp linear infinite;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
    }

    /* Custom Style for Stage 2 White Balloons */
    .balloon.white-balloon {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0.9;
      }
      50% {
        transform: translateY(-50vh) scale(1.05) rotate(12deg);
      }
      100% {
        transform: translateY(-105vh) scale(1) rotate(-12deg);
        opacity: 0.1;
      }
    }

    /* ================= REALISTIC 3D CAKE DESIGN (EXACT BOTTOM-LEFT CORNER) ================= */
    .cake-wrapper {
      position: absolute;
      left: 0;
      bottom: 0;
      z-index: 4;
      width: 180px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
    }

    /* Glass Plate Base */
    .cake-plate {
      position: absolute;
      bottom: 0;
      width: 180px;
      height: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #e0e0e0 100%);
      border-radius: 50%;
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.25), inset 0 2px 5px rgba(255, 255, 255, 0.8);
      z-index: 1;
    }

    /* Bottom Tier */
    .cake-tier-bottom {
      position: absolute;
      bottom: 8px;
      width: 140px;
      height: 65px;
      background: linear-gradient(180deg, #ff85a1 0%, #ff4d6d 70%, #c9184a 100%);
      border-radius: 10px 10px 15px 15px;
      box-shadow: inset 0 -8px 12px rgba(0,0,0,0.2), 0 6px 12px rgba(0,0,0,0.15);
      z-index: 2;
    }

    /* Bottom Frosting & Drips */
    .cake-tier-bottom::before {
      content: '';
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 20px;
      background: #ffffff;
      border-radius: 10px 10px 12px 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      background-image: radial-gradient(circle at 11.5px 16px, #ffffff 8.5px, transparent 9.5px);
      background-size: 23px 23px;
    }

    /* Top Tier */
    .cake-tier-top {
      position: absolute;
      bottom: 68px;
      width: 95px;
      height: 52px;
      background: linear-gradient(180deg, #ffb3c1 0%, #ff758f 70%, #ff4d6d 100%);
      border-radius: 8px 8px 12px 12px;
      box-shadow: inset 0 -6px 10px rgba(0,0,0,0.18), 0 5px 10px rgba(0,0,0,0.12);
      z-index: 3;
    }

    /* Top Frosting Surface */
    .top-frosting {
      position: absolute;
      top: -2px;
      left: 0;
      width: 100%;
      height: 16px;
      background: #ffffff;
      border-radius: 8px 8px 10px 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      background-image: radial-gradient(circle at 8px 13px, #ffffff 7px, transparent 8px);
      background-size: 16px 18px;
    }

    /* Candles Standing CLEANLY ABOVE the Top Most Cake Layer */
    .candles-holder {
      position: absolute;
      bottom: 118px;
      width: 68px;
      display: flex;
      justify-content: space-between;
      z-index: 5;
    }

    .real-candle {
      position: relative;
      width: 7px;
      height: 30px;
      background: repeating-linear-gradient(45deg, #ffffff, #ffffff 4px, #ff2a5f 4px, #ff2a5f 8px);
      border-radius: 2px 2px 2px 2px;
      box-shadow: inset -1px 0 3px rgba(0,0,0,0.25), 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Small candle stand base touching top frosting */
    .real-candle::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      transform: translateX(-50%);
      width: 9px;
      height: 3px;
      background: #e0e0e0;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    }

    /* Candle Wick */
    .wick {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 5px;
      background: #222;
    }

    /* Glowing Realistic Flame */
    .real-flame {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 16px;
      background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffea00 25%, #ff6d00 70%, transparent 100%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 10px #ff9e00, 0 0 18px #ff6d00, 0 0 28px #ff2a5f;
      animation: realisticFlicker 0.12s infinite alternate ease-in-out;
    }

    @keyframes realisticFlicker {
      0% {
        transform: translateX(-50%) scale(1) rotate(-1.5deg);
        opacity: 0.92;
      }
      100% {
        transform: translateX(-50%) scale(1.12) rotate(1.5deg);
        opacity: 1;
        filter: drop-shadow(0 0 8px #ffea00);
      }
    }
  </style>
</head>
<body>

  <div class="mobile-frame">

    <!-- STAGE 1: Interactive Bow & Heart -->
    <div id="stage-1">
      <div class="top-text">a little something, for you</div>
      
      <div class="target-heart-wrapper">
        <div class="target-heart-glow"></div>
        <div class="target-heart" id="targetHeart">♥</div>
      </div>

      <div class="bow-container" id="bow">
        <svg class="bow-svg" viewBox="0 0 100 150">
          <path d="M 50 10 Q 15 75 50 140" fill="none" stroke="#4a2e2b" stroke-width="6" stroke-linecap="round"/>
          <path id="string" d="M 50 10 L 50 75 L 50 140" fill="none" stroke="#bbb" stroke-width="2"/>
          <g id="nockedArrow">
            <line x1="10" y1="75" x2="65" y2="75" stroke="#3e2723" stroke-width="3"/>
            <polygon points="65,70 77,75 65,80" fill="#e63946"/>
          </g>
        </svg>
      </div>

      <div class="instruction">PULL & RELEASE</div>
    </div>

    <div class="flying-arrow" id="flyingArrow"></div>

    <!-- STAGE 2: Red Card Transition -->
    <div id="stage-2">
      <!-- Container for Stage 2 White Floating Balloons -->
      <div class="balloon-container" id="stage2BalloonContainer"></div>

      <div class="wish-subtext">Wishing you a fabulous birthday surrounded by love,joy and all the things that make you smile.</div>
      <div class="wish-title">Happy<br>Birthday</div>
      <div class="wish-footer">You deserve everything wonderful today and always</div>
    </div>

    <!-- STAGE 3: Realistic Cake with Candles Standing ABOVE top layer & Continuous Love Balloons -->
    <div id="stage-3">
      <div class="stage3-bg-image"></div>
      
      <!-- Continuous Flying Love Balloons -->
      <div class="balloon-container" id="balloonContainer"></div>

      <div class="tree-text-container">
        <div class="tree-sub1"></div>
        <div class="tree-title">Happy Birthday</div>
        <div class="tree-sub2">Kazi Suhita Arobi (Tanha)</div>
      </div>

      <!-- Realistic Cake Structure (Bottom-Left Corner) -->
      <div class="cake-wrapper">
        <!-- Candles standing directly ABOVE top layer -->
        <div class="candles-holder">
          <div class="real-candle">
            <div class="wick"></div>
            <div class="real-flame"></div>
          </div>
          <div class="real-candle">
            <div class="wick"></div>
            <div class="real-flame"></div>
          </div>
          <div class="real-candle">
            <div class="wick"></div>
            <div class="real-flame"></div>
          </div>
        </div>

        <div class="cake-tier-top">
          <div class="top-frosting"></div>
        </div>
        <div class="cake-tier-bottom"></div>
        <div class="cake-plate"></div>
      </div>
    </div>

  </div>

  <script>
    // --- STAGE 1 LOGIC ---
    const bow = document.getElementById('bow');
    const string = document.getElementById('string');
    const nockedArrow = document.getElementById('nockedArrow');
    const targetHeart = document.getElementById('targetHeart');
    const flyingArrow = document.getElementById('flyingArrow');
    const frame = document.querySelector('.mobile-frame');

    let isDragging = false;
    let startX = 0, startY = 0;
    let pullDistance = 0;
    let stage2Interval;

    bow.addEventListener('mousedown', startPull);
    bow.addEventListener('touchstart', startPull, {passive: false});

    window.addEventListener('mousemove', pull);
    window.addEventListener('touchmove', pull, {passive: false});

    window.addEventListener('mouseup', release);
    window.addEventListener('touchend', release);

    bow.addEventListener('click', () => {
      if (pullDistance === 0) shootArrow();
    });

    function startPull(e) {
      isDragging = true;
      startX = e.touches ? e.touches[0].clientX : e.clientX;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
    }

    function pull(e) {
      if (!isDragging) return;
      if (e.cancelable) e.preventDefault();

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const dx = startX - clientX;
      const dy = clientY - startY;

      pullDistance = Math.min(Math.hypot(dx, dy), 42);

      const pullX = 50 - pullDistance;
      string.setAttribute('d', `M 50 10 L ${pullX} 75 L 50 140`);
      nockedArrow.setAttribute('transform', `translate(-${pullDistance}, 0)`);
    }

    function release() {
      if (!isDragging) return;
      isDragging = false;

      string.setAttribute('d', `M 50 10 L 50 75 L 50 140`);
      nockedArrow.setAttribute('transform', `translate(0, 0)`);

      if (pullDistance > 10) {
        shootArrow();
      }
      pullDistance = 0;
    }

    function shootArrow() {
      const bRect = bow.getBoundingClientRect();
      const hRect = targetHeart.getBoundingClientRect();
      const fRect = frame.getBoundingClientRect();

      const startX = (bRect.left + bRect.width / 2) - fRect.left;
      const startY = (bRect.top + bRect.height / 2) - fRect.top;
      const endX = (hRect.left + hRect.width / 2) - fRect.left;
      const endY = (hRect.top + hRect.height / 2) - fRect.top;

      flyingArrow.style.left = `${startX}px`;
      flyingArrow.style.top = `${startY}px`;
      flyingArrow.style.display = 'block';

      const deltaX = endX - startX;
      const deltaY = endY - startY;
      const angle = Math.atan2(deltaY, deltaX) * (180 / Math.PI);

      flyingArrow.style.transform = `rotate(${angle}deg)`;

      const animation = flyingArrow.animate([
        { left: `${startX}px`, top: `${startY}px` },
        { left: `${endX - 15}px`, top: `${endY}px` }
      ], {
        duration: 320,
        easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
        fill: 'forwards'
      });

      animation.onfinish = () => {
        flyingArrow.style.display = 'none';
        
        targetHeart.style.transform = 'scale(1.35)';
        targetHeart.style.color = '#ff0044';
        createHeartBurst(endX, endY);
        
        setTimeout(() => {
          transitionToStage2();
        }, 400);
      };
    }

    function createHeartBurst(x, y) {
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerHTML = '♥';
        p.style.left = `${x}px`;
        p.style.top = `${y}px`;
        frame.appendChild(p);

        const angle = (Math.PI * 2 * i) / 16;
        const dist = 55 + Math.random() * 40;

        p.animate([
          { transform: 'translate(0, 0) scale(1.2)', opacity: 1 },
          { transform: `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(0)`, opacity: 0 }
        ], {
          duration: 650,
          easing: 'ease-out'
        }).onfinish = () => p.remove();
      }
    }

    // --- STAGE TRANSITIONS ---
    function transitionToStage2() {
      const stage1 = document.getElementById('stage-1');
      const stage2 = document.getElementById('stage-2');

      stage1.style.opacity = '0';
      setTimeout(() => {
        stage1.style.display = 'none';
        stage2.classList.add('active');

        // Start Floating White Balloons for Stage 2
        startStage2Balloons();

        setTimeout(() => {
          clearInterval(stage2Interval);
          transitionToStage3();
        }, 4600);
      }, 800);
    }

    function transitionToStage3() {
      const stage2 = document.getElementById('stage-2');
      const stage3 = document.getElementById('stage-3');

      stage2.style.opacity = '0';
      setTimeout(() => {
        stage2.classList.remove('active');
        stage3.classList.add('active');
        startContinuousBalloons();
      }, 900);
    }

    // --- STAGE 2 FLOATING WHITE BALLOONS LOGIC ---
    function startStage2Balloons() {
      const container = document.getElementById('stage2BalloonContainer');
      const heartIcons = ['♥', '💖', '💕', '💗', '🤍'];

      stage2Interval = setInterval(() => {
        const balloon = document.createElement('div');
        balloon.className = 'balloon white-balloon';
        balloon.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        
        const randomLeft = Math.random() * 85 + 5;
        const duration = Math.random() * 2 + 3.5;
        const size = Math.random() * 1.5 + 1.2;

        balloon.style.left = `${randomLeft}%`;
        balloon.style.animationDuration = `${duration}s`;
        balloon.style.fontSize = `${size}rem`;

        container.appendChild(balloon);

        setTimeout(() => {
          balloon.remove();
        }, duration * 1000);
      }, 300);
    }

    // --- CONTINUOUS FLOATING LOVE BALLOONS LOGIC (STAGE 3) ---
    function startContinuousBalloons() {
      const container = document.getElementById('balloonContainer');
      const heartIcons = ['♥', '💖', '💕', '💗', '❤️'];

      function spawnBalloon() {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        balloon.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
        
        const randomLeft = Math.random() * 85 + 5;
        const duration = Math.random() * 3 + 4.5;
        const size = Math.random() * 1.5 + 1.2;

        balloon.style.left = `${randomLeft}%`;
        balloon.style.animationDuration = `${duration}s`;
        balloon.style.fontSize = `${size}rem`;

        container.appendChild(balloon);

        setTimeout(() => {
          balloon.remove();
        }, duration * 1000);
      }

      setInterval(spawnBalloon, 400);
    }
  </script>
</body>
</html>
